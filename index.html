<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Super Power Tycoon</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://jsdelivr.net"
      }
    }
  </script>
</head>
<body oncontextmenu="return false;">

  <div id="hud">
    <div class="stats-col">
      <div class="cash-box">$<span id="cashDisplay">0</span></div>
      <div class="hp-wrap"><div id="hp-bar"></div></div>
      <div class="controls-hint">
        PC: WASD Move • Space Jump • Drag Mouse Look • Click/E Power<br>
        Mobile: Stick Move • Drag Right Side to Look
      </div>
    </div>
    <div class="leaderboard">
      <strong>Super Power Tycoon</strong>
      <div><span>Cash</span><span id="lbCash">$0</span></div>
      <div><span>KOs</span><span id="lbKOs">0</span></div>
      <div><span>Boost</span><span id="lbBoost">1.0x</span></div>
    </div>
  </div>

  <div id="toast">Message</div>
  <div id="hotbar"></div>

  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="action-buttons">
    <div id="power-btn" class="round-btn">USE</div>
    <div id="jump-btn" class="round-btn">JUMP</div>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
